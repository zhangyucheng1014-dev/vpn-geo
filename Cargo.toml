[package]
name = "vpn-geo"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Event-driven NetworkManager VPN profile prioritizer and network diagnostics"
license = "MIT"
repository = "https://github.com/zhangyucheng1014-dev/vpn-geo"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
futures-util = "0.3"
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
