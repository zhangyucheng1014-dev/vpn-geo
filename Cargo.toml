[workspace]
members = [
  "crates/vpn-geo-domain",
  "crates/vpn-geo-app",
  "crates/vpn-geo-infra",
  "crates/vpn-geo-cli",
]
resolver = "3"

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/zhangyucheng1014-dev/vpn-geo"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
vpn-geo-domain = { path = "crates/vpn-geo-domain" }
vpn-geo-app = { path = "crates/vpn-geo-app" }
vpn-geo-infra = { path = "crates/vpn-geo-infra" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.vpn-geo-domain]
opt-level = 3

[profile.release.package.vpn-geo-app]
opt-level = 3
