# Only connection.autoconnect-priority is ever changed for these UUIDs.
settle_delay = "3s"
quiet_period = "500ms"

[geoip]
url = "https://ipwho.is/"
timeout = "10s"

[benchmark]
# speed is manual only; it never runs from the VPN event handler.
candidate_countries = 3
samples = 3
request_timeout = "8s"
download_bytes = 10485760
parallel = 2

[[nodes]]
name = "jp-tokyo-1"
uuid = "REPLACE-WITH-NETWORKMANAGER-PROFILE-UUID"
country = "JP"
# Optional values used only by speed.
latitude = 35.6762
longitude = 139.6503
test_url = "https://replace-with-your-test-host.example/test-10MiB.bin"

[[nodes]]
name = "kr-seoul-1"
uuid = "REPLACE-WITH-NETWORKMANAGER-PROFILE-UUID-2"
country = "KR"
latitude = 37.5665
longitude = 126.9780
test_url = "https://replace-with-your-test-host.example/test-10MiB.bin"
