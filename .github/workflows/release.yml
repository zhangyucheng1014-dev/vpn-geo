name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_arch: amd64
          - target: aarch64-unknown-linux-gnu
            archive_arch: arm64
          - target: armv7-unknown-linux-gnueabihf
            archive_arch: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build archive
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_ARCH: ${{ matrix.archive_arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          cargo install cross --git https://github.com/cross-rs/cross --locked
          cross build --locked --release --target "$TARGET"
          archive="vpn-geo_${VERSION#v}_linux_${ARCHIVE_ARCH}"
          mkdir -p "dist/$archive"
          install -m 0755 "target/$TARGET/release/vpn-geo" "dist/$archive/vpn-geo"
          install -m 0644 README.md README.en.md LICENSE "dist/$archive/"
          install -m 0644 examples/config.toml "dist/$archive/config.toml.example"
          install -m 0644 packaging/vpn-geo-user.service "dist/$archive/vpn-geo.service"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          (cd dist && sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive_arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
